name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Before installing anything: doctor must work on a bare interpreter.
      - name: Doctor without optional dependencies
        run: python scripts/gdcpps.py doctor

      - name: Install test dependencies
        run: python -m pip install pyyaml

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test (init + render-profile)
        shell: bash
        run: |
          python scripts/gdcpps.py init smoketest --dir "$RUNNER_TEMP/smoketest"
          python scripts/gdcpps.py render-profile "$RUNNER_TEMP/smoketest" windows
          python scripts/gdcpps.py render-profile "$RUNNER_TEMP/smoketest" web
          grep -q 'optimize = "speed"' "$RUNNER_TEMP/smoketest/.gdcpps/generated/windows.profile.py"
          grep -q 'threads = "no"' "$RUNNER_TEMP/smoketest/.gdcpps/generated/web.profile.py"
