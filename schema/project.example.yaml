project:
  name: samplegame
  module_name: samplegame
  godot_version: 4.5.1

build:
  cpp_standard: c++20
  shared:
    extra_include_dirs: []
    extra_source_globs: []

profiles:
  base: desktop-default
  web: web-small
  ios: mobile-default
  android: mobile-default

features:
  enable: []
  disable:
    - gdscript
    - advanced_gui

platforms:
  windows:
    enable:
      - physics_3d
    build:
      debug:
        extra_include_dirs: []
      module:
        extra_include_dirs: []
  web:
    disable:
      - physics_2d
      - physics_3d
      - navigation_2d
      - navigation_3d
